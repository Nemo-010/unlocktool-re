[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unlocktool-re"
version = "1.0.0"
description = "Verified reproduction of UNLOCKTOOL ALBASHAA's offline components"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "0BSD"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[project.scripts]


[tool.setuptools.packages.find]
where = ["src"]
